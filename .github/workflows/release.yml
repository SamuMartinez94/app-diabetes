name: Flutter CI/CD & Release Please

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  # Gestiona las versiones y crea la Release de GitHub.
  # Solo en main: release-please siempre trabaja contra main, y si también se
  # ejecuta en dev, al subir las dos ramas a la vez las dos ejecuciones pelean
  # por la misma rama del PR de release ("Error updating ref").
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: dart

  # Compila y despliega
  build-and-deploy:
    runs-on: ubuntu-latest
    # Se ejecuta siempre en dev/main, o cuando Job 1 crea una release oficial.
    # En dev, release-please se omite: sin esta condición, este job también se
    # omitiría.
    needs: release-please
    if: ${{ !cancelled() && !failure() }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Firma de release. Si los secretos no existen (por ejemplo en un fork),
      # se omite y el APK se firma con la clave de debug: sirve para probar,
      # no para publicar. Ver "Publicar en Google Play" en el README.
      - name: Preparar firma de release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "Sin ANDROID_KEYSTORE_BASE64: se firmará con la clave de debug."
          fi

      # Compilación
      # Se excluye x86_64: solo lo usan los emuladores y son 17 MB del APK.
      # Sigue siendo un único archivo, para que el enlace del README no cambie.
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Build Web
        run: flutter build web --base-href "/${{ github.event.repository.name }}/" --release

      # GESTIÓN DE APK: Solo si Release Please acaba de crear una versión oficial
      - name: Upload APK to Official Release
        if: ${{ needs.release-please.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ needs.release-please.outputs.tag_name }}
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          # Subimos el APK directamente a la release que acaba de crear el bot
          gh release upload $TAG $APK_PATH --clobber

      # DESPLIEGUE WEB: (se ejecuta en cada push a main/dev)
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web



